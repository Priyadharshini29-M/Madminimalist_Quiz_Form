<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Landing Page Logic</title>
    <!-- Modern fonts + variables for theming -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Updated palette: only white, black and beige shades */
            --bg: #faf6ef; /* light beige background */
            /* off-white */
            --card: #ffffff;
            --text: #111111; /* black */
            --muted: #9a8f82; /* muted beige */
            --accent: #e6d9c7; /* beige (lighter) for subtle accents */
            --accent-dark: #d3c3aa; /* darker beige for hover states */
            --success: #111111; /* use black for success text */
            --danger: #111111; /* use black for danger fallback */
            --shadow: 0 6px 20px rgba(15, 23, 36, 0.08);
            --btn-elev: 0 12px 30px rgba(17,17,17,0.12);
            --btn-elev-2: 0 6px 18px rgba(17,17,17,0.08);
            --btn-elev-pressed: 0 4px 8px rgba(17,17,17,0.06);
            --radius: 12px;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            height: 100%;
            overflow-x: hidden;
            background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
            color: var(--text);
        }

        /* ------------------ MAIN CONTENT ------------------ */
        .page-wrapper {
          
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }

        #mainContent {
            max-width: 960px;
            width: 100%;
            background: var(--card);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            font-size: 14px;
            
            filter: blur(8px);
            transition: 0.36s ease;
        }

        #mainContent h1 {
            margin-top: 0;
            font-size: 18px;
            margin-bottom: 6px;
        }

        /* Global p styles — desktop first */
        p { font-family: 'Poppins', sans-serif; font-size: 18px; }

        #mainContent p#dynamicText {
            color: var(--muted);
            font-size: 18px;
            margin-bottom: 12px;
        }

        /* Global H2 settings (desktop first) */
        h2 { font-family: 'Poppins', sans-serif; font-size: 24px; }

        /* ------------------ OVERLAYS ------------------ */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(4px);
        }

        /* ------------------ POPUP BOX ------------------ */
        .popup-box {
            background: var(--card);
            width: 92%;
            max-width: 560px;
            padding: 36px 26px 26px; /* increase top padding so content sits below close button */
            border-radius: 10px;
            text-align: center;
            animation: fadeIn 0.36s ease;
            box-shadow: var(--shadow);
            position: relative; /* allow close button absolute */
        }

        /* success styling for final popup */
        .popup-box.success {
            border-radius: 14px;
            padding: 28px 24px;
            background: linear-gradient(180deg, #ffffff 0%, #fffaf0 100%);
            animation: fadeIn 0.36s ease, popupPop 260ms ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .popup-box.success h2 { color: var(--success); font-size: 24px; margin: 0 0 6px; font-weight: 800; }
        .popup-box.success .code-box { background: linear-gradient(90deg,#fffaf0,#f6efe0); border: 0; color: var(--text); font-size: 18px; padding: 12px 20px; font-weight: 900; letter-spacing: 1px; border-radius: 8px; }

        /* final popup layout */
        .final-content { display:flex; flex-direction:column; gap:12px; align-items:center; justify-content:center; max-width:420px; }
        .final-content p { color: var(--muted); margin: 0; font-size: 18px; }
        .button-row { display:flex; gap:10px; align-items:center; justify-content:center; margin-top:6px; width:100%; }
        .button-row > * { flex: 1 1 0; display:inline-flex; justify-content:center; align-items:center; text-decoration:none; height:44px; }
        .copy-btn { background: #fff; color: var(--text); border: 1px solid rgba(15,23,36,0.06); }
        .copy-btn:hover { color: var(--text); }

            /* redirect CTA inside success popup */
            .redirect-btn {
                display: inline-flex; /* match the .button-row children styling */
                justify-content: center;
                align-items: center;
                text-decoration: none; /* ensure no underline at rest */
                background: var(--accent);
                color: white;
                border: none;
                border-radius: 10px;
                padding: 10px 18px;
                font-weight: 700;
                font-size: 15px;
                cursor: pointer;
                transition: transform 120ms ease, box-shadow 120ms ease, background 150ms ease;
                box-shadow: var(--btn-elev-2);
            }
            .redirect-btn:hover { transform: translateY(-3px); box-shadow: var(--btn-elev); background: var(--accent-dark); text-decoration: none; }

            /* Make sure all redirect anchor states don't show underline */
            .redirect-btn:link, .redirect-btn:visited, .redirect-btn:active { text-decoration: none; }

        .popup-box h2 {
            margin: 0 0 6px 0;
            font-size: 24px; /* desktop */
            line-height: 1.15;
            padding-right: 56px; /* add horizontal gap so text doesn't butt up against close button */
            font-weight: 700;
        }

        /* SPECIFIC: increase gap between close button and text for email popup */
       

        .popup-box p,
        .popup-box h3 {
            color: var(--muted);
        }

        /* ------------------ FORM ELEMENTS ------------------ */
        .popup-form { display:flex; flex-direction:column; gap:12px; align-items:center; justify-content:center; margin-top:12px; }
        .popup-form input[type="email"] {
            width: 100%; max-width:420px; padding:12px 14px; font-size:12px; border-radius:10px; border:1px solid rgba(15,23,36,0.08); background: #fff; box-sizing:border-box;
            transition: box-shadow 0.18s ease, border-color 0.18s ease;
        }
        .popup-form input[type="email"]:focus { outline:none; border-color: var(--accent); box-shadow: 0 6px 18px rgba(17,17,17,0.08); }
        .popup-subtext { color:var(--muted); font-size:10px; margin-top:6px; }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes popupPop {
            from { transform: translateY(2px) scale(0.98); }
            to { transform: translateY(0) scale(1); }
        }

        /* ------------------ CHOICE IMAGES ------------------ */
        .choice-container {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: nowrap;
            /* keep images side-by-side */
            overflow: hidden;
            /* no scrollbar, static */
            padding-bottom: 6px;
        }

        .choice-item {
            flex: 0 1 48%;
            /* occupy roughly half of the container, shrink if needed */
            min-width: 110px;
            /* allow items to shrink on small screens */
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 200ms ease, border-color 200ms ease, box-shadow 200ms ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 12px 8px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.3));
            box-sizing: border-box;
        }

        .choice-item img {
            width: 100%;
            object-fit: cover;
            border-radius: 8px;
            aspect-ratio: 16/9;
            /* landscape */
        }

        .choice-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 28px rgba(2, 6, 23, 0.08);
        }

        .choice-item.selected {
            border-color: var(--accent);
            box-shadow: 0 12px 36px rgba(17, 17, 17, 0.08);
        }

        .choice-label {
            font-weight: 600;
            color: var(--muted);
            font-size: 15px;
            text-align: center;
            white-space: normal;
        }



        /* ------------------ BUTTON ------------------ */
        .btn {
            display: inline-flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .submit-btn {
            display: block;
            margin: 24px auto 0;
            padding: 12px 20px;
            background: black;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 180ms ease, transform 120ms ease, box-shadow 120ms ease;
            box-shadow: var(--btn-elev-2);
            transform: translateY(0);
            will-change: transform, box-shadow;
        }

        .submit-btn:hover {
            background: rgb(255, 255, 250);
            transform: translateY(-4px) scale(1.01);
            box-shadow: var(--btn-elev);
            color:#111827
        }
        .submit-btn:active { transform: translateY(0) scale(0.995); box-shadow: var(--btn-elev-pressed); }
        .submit-btn:focus { outline: 3px solid rgba(17,17,17,0.12); }

        .copy-btn {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            background: var(--accent);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background 180ms ease, transform 120ms ease, box-shadow 120ms ease;
            box-shadow: var(--btn-elev-2);
            will-change: transform, box-shadow;
        }

        .copy-btn:hover { transform: translateY(-3px); box-shadow: var(--btn-elev); background: var(--accent-dark); }
        .copy-btn:active { transform: translateY(0); box-shadow: var(--btn-elev-pressed); }



        /* ------------------ overlay logo removed
           .logo styles no longer needed; page logo uses #pageLogo id */

        /* sr-only utility */
        .sr-only {
            border: 0;
            clip: rect(1px, 1px, 1px, 1px);
            clip-path: inset(50%);
            height: 1px;
            margin: -1px;
            overflow: hidden;
            padding: 0;
            position: absolute;
            width: 1px;
            white-space: nowrap;
        }

        /* ------------------ TOAST ------------------ */
        #toast {
            position: fixed;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            background: #111827;
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 9999999;
        }

        #toast.show {
            display: block;
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* make logo non-fixed: placed in normal flow above the main card */
        #pageLogo { position: static; margin: 0 auto 20px; text-align: center; z-index: auto; }
        #pageLogo img { width: 150px; max-width: 90%; height: auto; }

        /* small close button */
        .close-x {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 18px;
            cursor: pointer;
        }

        .close-x { position: absolute; right: 12px; top: 18px; }

        .close-x:focus {
            outline: 3px solid rgba(17, 17, 17, 0.18);
            border-radius: 6px;
        }

        @media (max-width: 420px) {
            .popup-box.success h2 { font-size: 20px; }
            .popup-box.success .code-box { font-size: 20px; padding: 8px 12px; }
            .redirect-btn, .copy-btn { padding: 8px 12px; font-size: 14px; height:40px; }
            .final-content { max-width: 360px; }
            .button-row > * { height: 40px; }
        }

        /* Mobile typography adjustments */
        @media (max-width: 520px) {
            h2 { font-size: 18px; }
            p { font-size: 12px; }
            .popup-box.success h2 { font-size: 18px; }
            .popup-box h2 { font-size: 18px; }
            .final-content p { font-size: 12px; }
        }

        /* Stack buttons on very small screens to ensure equal width and no wrapping */
        @media (max-width: 420px) {
            .button-row { flex-direction: column; gap: 8px; }
            .button-row > * { width: 100%; flex: 1 1 0; }
        }

            .popup-box {

        @media (max-width: 420px) {

}

.popup-box.success .code-box::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.8),
        transparent
    );
    animation: glitter 2s infinite;
}

@keyframes glitter {
    0% { left: -100%; }
    100% { left: 100%; }
}

@keyframes pop3D {
    0% { transform: perspective(500px) translateZ(-30px) scale(0.8); opacity: 0; }
    60% { transform: perspective(500px) translateZ(20px) scale(1.1); opacity: 1; }
    100% { transform: perspective(500px) translateZ(10px) scale(1); }
}

@keyframes shake {
    0% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
    100% { transform: translateX(0); }
}

        /* ---------------- COPY CODE + SHOW TOAST ---------------- */
        function copyCode() {
            const codeText = document.getElementById("code").innerText;

            navigator.clipboard.writeText(codeText).then(() => {
                showToast();
            }).catch(err => {
                const tempInput = document.createElement("input");
                tempInput.value = codeText;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);

                showToast();
            });
        }

        /* ---------------- TOAST FUNCTION ---------------- */
        function showToast() {
            const toast = document.getElementById("toast");
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        /* ---------------- ACCESSIBILITY: keyboard support for choice items ---------------- */
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.choice-item').forEach(item => {
                item.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        const choice = item.dataset.choice;
                        selectOption(choice, item);
                    }
                });
            });

            // close overlays on ESC
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    ['emailOverlay', 'questionOverlay', 'finalPopup'].forEach(id => {
                        const el = document.getElementById(id);
                        if (el && el.style.display === 'flex') el.style.display = 'none';
                    });
                }
            });
        });

        let currentIndex = 0;
        const slider = document.getElementById("bannerSlider");
        const slides = document.querySelectorAll(".banner-slide");
        const totalSlides = slides.length || 0;

        function goToSlide(i) {
            if (!slider || totalSlides === 0) return;
            currentIndex = ((i % totalSlides) + totalSlides) % totalSlides;
            slider.style.transform = `translateX(-${currentIndex * 100}%)`;
        }

        function nextSlide() { goToSlide(currentIndex + 1); }
        function prevSlide() { goToSlide(currentIndex - 1); }

        let autoSlideInterval = null;
        function startAutoSlide() {
            if (autoSlideInterval) return;
            autoSlideInterval = setInterval(nextSlide, 3000);
        }
        function stopAutoSlide() {
            if (autoSlideInterval) clearInterval(autoSlideInterval);
            autoSlideInterval = null;
        }

        // start auto sliding
        startAutoSlide();

        // Pause on hover (desktop) and resume on leave
        const bannerContainerEl = slider?.closest('.banner-container');
        if (bannerContainerEl) {
            bannerContainerEl.addEventListener('mouseenter', stopAutoSlide);
            bannerContainerEl.addEventListener('mouseleave', startAutoSlide);
        }

        // Touch support: simple swipe detection to change slides
        let touchStartX = 0;
        let touchDeltaX = 0;
        if (slider) {
            slider.addEventListener('touchstart', (e) => {
                stopAutoSlide();
                touchStartX = e.touches[0].clientX;
                touchDeltaX = 0;
            }, { passive: true });

            slider.addEventListener('touchmove', (e) => {
                if (!e.touches || e.touches.length === 0) return;
                touchDeltaX = e.touches[0].clientX - touchStartX;
            }, { passive: true });

            slider.addEventListener('touchend', () => {
                // threshold to trigger swipe
                const threshold = 40;
                if (touchDeltaX < -threshold) {
                    nextSlide();
                } else if (touchDeltaX > threshold) {
                    prevSlide();
                }
                touchStartX = 0;
                touchDeltaX = 0;
                startAutoSlide();
            });
        }

  } catch (error) {

}
